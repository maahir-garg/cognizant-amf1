name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Official ESG Fact Provenance (19 Facts)
        run: npm run extract-sources

      - name: Run AI Trust Layer Numeric Guardrail Tests
        run: npm run test:guardrail

      - name: Next.js Production Build
        run: npm run build
        env:
          DEMO_MODE: "true"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        run: npx playwright test tests/smoke.spec.ts --project="Desktop Chrome"
        env:
          DEMO_MODE: "true"
